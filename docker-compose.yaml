version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: qwikcart-backend
    container_name: qwikcart-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    networks:
      - qwikcart-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: qwikcart-frontend
    container_name: qwikcart-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - qwikcart-network

networks:
  qwikcart-network:
    driver: bridge